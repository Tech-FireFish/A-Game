<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Breachline Scene Editor</title>
    <link rel="stylesheet" href="scene-editor.css">
  </head>
  <body>
    <main class="editor-shell">
      <aside class="palette" aria-label="Resources">
        <h1>Scene Editor</h1>
        <button id="openLevelButton" type="button">Open File</button>
        <input id="openLevelInput" class="hidden-file-input" type="file" accept=".json,application/json">
        <button data-resource="hand" type="button">Hand</button>
        <button data-resource="wall" type="button">Wall</button>
        <button data-resource="door" type="button">Door</button>
        <button data-resource="window" type="button">Window</button>
        <button data-resource="label" type="button">Room Label</button>
        <button data-resource="stairs" type="button">Stairs A/B</button>
        <button data-resource="equipmentTable" type="button">Weapon Table</button>
        <button data-resource="paper" type="button">Paper Clue</button>
        <button data-resource="operator" type="button">Operator</button>
        <button data-resource="enemy" type="button">Enemy</button>
        <button data-resource="objective" type="button">Objective</button>
        <button id="downloadLevelButton" type="button">Download Level JSON</button>
      </aside>
      <section class="board-wrap" aria-label="Scene board">
        <canvas id="sceneBoard" width="1200" height="760"></canvas>
        <div class="view-controls" aria-label="View controls">
          <button id="zoomOutButton" type="button">Shorten View</button>
          <strong id="zoomValue">100%</strong>
          <button id="zoomInButton" type="button">Enlarge View</button>
        </div>
      </section>
      <aside class="properties" aria-label="Selected object properties">
        <h2>Properties</h2>
        <div id="propertyPanel" class="property-panel">Select or place an object.</div>
      </aside>
    </main>
    <section id="downloadDialog" class="download-dialog hidden" aria-label="Download level JSON" aria-modal="true" role="dialog">
      <div class="download-card">
        <h2>Download Level JSON</h2>
        <label class="field" for="downloadFileNameInput">
          <span>File name</span>
          <input id="downloadFileNameInput" type="text" value="custom-level.json">
        </label>
        <p>Browser downloads save to your normal Downloads folder. Choose the filename here, then move the file if needed.</p>
        <div class="download-actions">
          <button id="cancelDownloadButton" type="button">Cancel</button>
          <button id="confirmDownloadButton" type="button">Download</button>
        </div>
      </div>
    </section>
    <div id="objectContextMenu" class="object-context-menu hidden" role="menu" aria-label="Object actions">
      <button id="deleteObjectButton" type="button" role="menuitem">Delete</button>
    </div>
    <script src="scene-editor.js"></script>
  </body>
</html>
